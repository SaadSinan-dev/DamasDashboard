org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Jetifier rewrites legacy `android.support.*` references to AndroidX. No
# dependency in this project ships support-library code, so leaving it on only
# cost build time — and AGP 9 removes the flag entirely.
android.enableJetifier=false
