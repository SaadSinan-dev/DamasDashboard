name: damas_dashboard
description: >-
  Damas Dashboard — a bilingual (English/Arabic) Flutter business-intelligence
  dashboard built on Clean Architecture with Bloc, GetIt and go_router.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Cubits keep presentation logic out of widgets.
  flutter_bloc: ^9.1.1
  # Value equality for entities and states, so Bloc can skip identical emissions.
  equatable: ^2.1.0
  # Service locator, used only at composition roots (bootstrap + route builders).
  get_it: ^9.2.1
  # Declarative routing with a stateful shell, deep links and typed route names.
  go_router: ^17.4.0
  # Key/value persistence for user settings (theme mode, locale).
  shared_preferences: ^2.5.5
  # Date/number formatting that respects the active locale and numeral system.
  intl: ^0.20.2
  # Charting for the revenue time series.
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Seed payloads for the bundled local data source. Shaped like an API
    # response so swapping in a remote data source needs no domain changes.
    - assets/data/

  fonts:
    # Display face for Latin text — headlines and numerics only.
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700

    # Body face for Latin text — Oswald is too condensed to read at 12–16px.
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed.ttf
        - asset: assets/fonts/RobotoCondensed-Italic.ttf
          style: italic

    # Arabic face, used for every text role when the locale is `ar`.
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
